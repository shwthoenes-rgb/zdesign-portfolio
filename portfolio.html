<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Design Portfolio</title> <style> body { margin: 0; background: #181818; } #viewer { width: 100%; } canvas { display: block; width: 100%; height: auto; margin: 0 auto 30px; } </style> </head> <body> <div id="viewer"></div> <script type="module"> import * as pdfjsLib from "./pdfjs/pdf.mjs"; pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfjs/pdf.worker.mjs"; const viewer = document.getElementById("viewer"); async function renderPDF() { const pdf = await pdfjsLib.getDocument({ url: "./portfolio.pdf", useWorkerFetch: true, isEvalSupported: true }).promise; for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) { const page = await pdf.getPage(pageNum); const viewport = page.getViewport({ scale: 1 }); const scale = window.innerWidth / viewport.width; const scaledViewport = page.getViewport({ scale: scale }); const canvas = document.createElement("canvas"); const context = canvas.getContext("2d"); canvas.width = scaledViewport.width; canvas.height = scaledViewport.height; viewer.appendChild(canvas); await page.render({ canvasContext: context, viewport: scaledViewport }).promise; } } renderPDF(); </script> </body> </html>
